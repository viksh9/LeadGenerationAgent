# Candidate data sources for LeadGenerationAgent (real-data phase).
#
# EVERY source below is PLANNED. A source is only considered CONNECTED once its
# collector is implemented, tested, and verified. This file contains metadata
# ONLY — never API keys or credentials (those come from the environment:
# SOURCE_<SOURCE_ID>_API_KEY). Compliance fields document posture; the system
# never bypasses auth, robots, rate limits, or access controls.

sources:
  - source_id: adzuna
    name: Adzuna Jobs API
    category: JOB
    source_type: THIRD_PARTY_API
    base_url: https://api.adzuna.com/v1/api
    status: NOT_CONFIGURED
    enabled: false
    requires_api_key: true
    priority: 2
    rate_limit: { requests_per_minute: 20, requests_per_day: 200 }
    supports_search: true
    supports_pagination: true
    supports_incremental_fetch: true
    supports_date_filter: true
    supports_location: true
    supports_salary: true
    supports_job_id: true
    data_quality: MEDIUM
    commercial_use_status: REQUIRES_APPROVAL
    compliance:
      terms_status: REQUIRES_REVIEW
      robots_status: UNKNOWN
      api_terms_reviewed: true
      commercial_use_status: REQUIRES_APPROVAL
      data_retention_notes: >-
        Adzuna's current terms require review/approval for ongoing commercial use.
        Store only what the API returns; keep source_url attribution. See
        docs/sources/adzuna.md before enabling in production.
    notes: >-
      Public jobs aggregator API. Collector implemented (collectors/jobs/adzuna.py)
      and unit-tested offline (no network by default). Country defaults to `in`
      (India) but is configurable via ADZUNA_COUNTRY. Credentials come from
      ADZUNA_APP_ID / ADZUNA_APP_KEY; status is NOT_CONFIGURED until both are set
      and only CONNECTED once verified against the live API. Incremental fetch is a
      recency window (max_days_old) + dedup, not a true cursor.

  - source_id: company_career_pages
    name: Company Career Pages
    category: COMPANY
    source_type: PUBLIC_WEB
    base_url: null
    status: REQUIRES_REVIEW
    enabled: false
    requires_api_key: false
    priority: 1
    rate_limit: { requests_per_minute: 10, requests_per_day: 500 }
    supports_search: false
    supports_pagination: true
    supports_incremental_fetch: false
    supports_date_filter: false
    supports_location: true
    supports_salary: true
    supports_job_id: true
    data_quality: HIGH
    commercial_use_status: RESTRICTED
    compliance:
      terms_status: REQUIRES_REVIEW
      robots_status: REQUIRES_APPROVAL
      api_terms_reviewed: false
      commercial_use_status: RESTRICTED
      data_retention_notes: >-
        Respect each site's robots.txt and terms; collect only permitted public
        pages and store no personal data. See docs/sources/company-career-pages.md.
    notes: >-
      Generic CareerPageCollector implemented (collectors/company/career_page.py):
      structured-data-first (JSON-LD / embedded JSON), robots-aware, SSRF-guarded,
      no JavaScript execution. Per-company sources live in config/career_sources.yaml
      and are all PLANNED/disabled — no company source is CONNECTED until verified
      end-to-end. Status stays PLANNED at the aggregate level.

  - source_id: government_open_data
    name: Government Open Data / Tenders
    category: GOVERNMENT
    source_type: OPEN_DATA
    base_url: null
    status: PLANNED
    enabled: false
    requires_api_key: false
    rate_limit: { requests_per_minute: 15, requests_per_day: 2000 }
    supports_search: true
    supports_pagination: true
    supports_incremental_fetch: true
    supports_date_filter: true
    data_quality: HIGH
    commercial_use_status: ALLOWED
    compliance:
      terms_status: ALLOWED
      robots_status: ALLOWED
      api_terms_reviewed: false
      commercial_use_status: ALLOWED
      data_retention_notes: Open data licences typically permit reuse with attribution.
    notes: Public tender/award portals publishing project and contract signals.

