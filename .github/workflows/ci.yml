name: CI

# Continuous integration for LeadGenerationAgent (Prompt 40 §51).
# CI runs ONLY against throwaway/empty databases — it is never connected to
# production business data. No real credentials are required or used.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Force a safe, test-only environment for every job.
  APP_ENV: test
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if obvious secrets are committed
        run: |
          set -e
          # Common credential shapes. .env is gitignored and must never be tracked.
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env is tracked in git"; exit 1
          fi
          MATCHES=$(grep -rInE 'sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_\-]{30,}|xox[baprs]-[0-9A-Za-z-]{10,}' \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist . || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::possible secret literal found"; echo "$MATCHES" | sed 's/=.*/=<redacted>/'; exit 1
          fi
          echo "no committed secrets detected"

  backend:
    name: Backend tests + audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backend test suite
        run: python -m pytest -q
      - name: Data-integrity audit (fresh empty DB)
        run: python -m app.audit validate-data --fail-on-issues
      - name: Production-readiness audit (test env)
        run: python -m app.audit production-readiness

  frontend:
    name: Frontend build + tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check + production build
        run: npm run build
      - name: Unit/component tests
        run: npm test
      - name: Lint
        run: npm run lint

  docker-build:
    name: Docker image build (no push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t leadgen:ci .
